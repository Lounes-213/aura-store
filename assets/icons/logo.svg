<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7A38" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem Icon: Diamond Monogram A -->
  <g transform="translate(15, 10)">
    <!-- Outer Rhombus / Diamond -->
    <path d="M 25 2 L 48 25 L 25 48 L 2 25 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Inner faceted geometry -->
    <path d="M 25 8 L 42 25 L 25 42 L 8 25 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />
    <!-- Stylized A center needle -->
    <path d="M 25 12 L 34 36 M 25 12 L 16 36 M 19 28 L 31 28" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <!-- North star accent -->
    <circle cx="25" cy="2" r="2" fill="#E5C378" filter="url(#glow)" />
  </g>

  <!-- Typography: AURA -->
  <text x="75" y="38" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="28" font-weight="700" letter-spacing="6" fill="#1C1917">AURA</text>
  
  <!-- Sub-label: HAUTE COUTURE -->
  <text x="77" y="52" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" letter-spacing="4.5" fill="#78716C">HAUTE COUTURE</text>
  
  <!-- Small Gold separator bar -->
  <line x1="230" y1="34" x2="260" y2="34" stroke="url(#goldGrad)" stroke-width="1" />
  <circle cx="245" cy="34" r="2" fill="#C5A059" />
</svg>
