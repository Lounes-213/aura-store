<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل القطعة — AURA Haute Couture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Montserrat:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
  <style>
    .product-detail-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: var(--space-3xl);
      padding: var(--space-3xl) 0;
      align-items: flex-start;
    }

    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      position: sticky;
      top: 100px;
    }

    .main-image-display {
      width: 100%;
      height: 560px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-muted);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-md);
    }

    .main-image-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .main-image-display:hover img {
      transform: scale(1.03);
    }

    .thumbnails-row {
      display: flex;
      gap: var(--space-sm);
    }

    .thumb-item {
      width: 80px;
      height: 100px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.7;
      transition: var(--transition-fast);
    }

    .thumb-item.active, .thumb-item:hover {
      opacity: 1;
      border-color: var(--color-accent);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-info-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      box-shadow: var(--shadow-sm);
    }

    .size-selector, .color-selector {
      display: flex;
      gap: var(--space-sm);
      margin: var(--space-md) 0 var(--space-lg);
      flex-wrap: wrap;
    }

    .size-btn {
      padding: 10px 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-card);
      color: var(--color-foreground);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-fast);
      font-family: var(--font-mono);
    }

    .size-btn.active, .size-btn:hover {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }

    .color-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition-fast);
    }

    .color-pill.active {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
    }

    @media (max-width: 900px) {
      .product-detail-layout { grid-template-columns: 1fr; }
      .main-image-display { height: 400px; }
      .gallery-container { position: static; }
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">
        <img src="./assets/icons/logo-light.svg" alt="AURA Logo">
      </a>
      <nav>
        <ul class="main-nav">
          <li><a href="index.html" data-i18n="nav.home">الرئيسية</a></li>
          <li><a href="catalog.html" data-i18n="nav.catalog">المجموعة الكاملة</a></li>
          <li><a href="catalog.html?category=suits" data-i18n="nav.suits">بدلات وتوكسيدو</a></li>
          <li><a href="catalog.html?category=shirts" data-i18n="nav.shirts">قمصان بيضاء</a></li>
          <li><a href="about.html" data-i18n="nav.about">عن الدار</a></li>
        </ul>
      </nav>
      <div class="header-tools">
        <button class="lang-select-btn" title="Language">
          🌐 <span class="current-lang">AR</span>
        </button>
        <button class="btn-icon theme-toggle" title="Theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button class="btn-icon cart-trigger" title="Cart">
          <span class="cart-count">0</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Product Details Container -->
  <main class="container">
    <div style="padding: var(--space-lg) 0;">
      <a href="catalog.html" style="color:var(--color-muted-foreground); text-decoration:none; font-size:0.9rem;" data-i18n="product.back">← العودة إلى المجموعة الرسمية</a>
    </div>

    <div class="product-detail-layout" id="product-detail-view"></div>
  </main>

  <!-- Cart Drawer Component -->
  <div class="cart-drawer-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer-header">
      <div style="display: flex; align-items: center; gap: var(--space-sm);">
        <h3 style="font-size: 1.25rem;" data-i18n="cart.title">حقيبة المشتريات الرسمية</h3>
        <span class="badge badge-gold cart-count">0</span>
      </div>
      <button class="btn-icon" id="close-cart-btn" style="border:none;">✕</button>
    </div>
    <div class="cart-items-list" id="cart-items-list"></div>
    <div class="cart-drawer-footer">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md);">
        <span style="color: var(--color-muted-foreground); font-weight: 600;" data-i18n="cart.subtotal">المجموع الفرعي:</span>
        <span id="cart-total-price" style="font-size: 1.3rem; font-weight: 800; font-family: var(--font-mono); color: var(--color-foreground);">0 DZD</span>
      </div>
      <a href="checkout.html" class="btn btn-primary" style="width: 100%; border-radius: var(--radius-md);" data-i18n="cart.checkoutBtn">
        متابعة إتمام الطلب (Checkout)
      </a>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="site-footer" style="margin-top: var(--space-3xl);">
    <div class="container footer-bottom">
      <p data-i18n="footer.copyright">© 2026 دار AURA للملابس الرسمية الراقية.</p>
      <p><a href="index.html" style="color:var(--color-accent);text-decoration:none;" data-i18n="checkout.homeReturn">العودة للرئيسية</a></p>
    </div>
  </footer>

  <script src="./js/i18n.js"></script>
  <script src="./js/store.js"></script>
  <script>
    let selectedSize = '50';
    let selectedColor = null;

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(renderProductPage, 200);
    });

    window.onAuraLanguageChanged = () => {
      renderProductPage();
    };

    function renderProductPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id') || 'aura-suit-01';

      if (!window.auraStore || !window.auraStore.products.length) return;
      const p = window.auraStore.products.find(x => x.id === prodId) || window.auraStore.products[0];

      const name = window.auraStore.getLocalized(p.name);
      const cat = window.auraStore.getLocalized(p.categoryLabel);
      const desc = window.auraStore.getLocalized(p.description);
      const t = window.auraStore.t.product || {};
      const tFeatured = window.auraStore.t.featured || {};

      selectedSize = p.sizes[0] || '50';
      selectedColor = window.auraStore.getLocalized(p.colors[0]?.name) || 'أسود ملكي';

      const view = document.getElementById('product-detail-view');
      view.innerHTML = `
        <div class="gallery-container">
          <div class="main-image-display">
            <img src="${p.image}" alt="${name}" id="current-main-img">
          </div>
          ${p.gallery && p.gallery.length > 1 ? `
            <div class="thumbnails-row">
              ${p.gallery.map((img, idx) => `
                <div class="thumb-item ${idx===0?'active':''}" onclick="changeGalleryImage('${img}', this)">
                  <img src="${img}" alt="thumbnail">
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>

        <div class="detail-info-card">
          <span class="badge badge-gold" style="margin-bottom: var(--space-sm);">${cat}</span>
          <h1 style="font-family:'Amiri',serif; font-size: 2.3rem; margin-bottom: var(--space-sm); line-height: 1.25;">${name}</h1>
          <p style="font-size: 0.9rem; color: var(--color-muted-foreground); margin-bottom: var(--space-lg);">
            ${t.refCode || 'Reference:'} <span style="font-family: var(--font-mono); font-weight:700;">#AURA-${p.id.toUpperCase()}</span>
          </p>

          <div style="display: flex; align-items: baseline; gap: var(--space-md); margin-bottom: var(--space-xl);">
            <span style="font-size: 2rem; font-weight: 800; font-family: var(--font-mono); color: var(--color-foreground);">
              ${window.auraStore.formatPrice(p.price)}
            </span>
            ${p.oldPrice ? `<span style="text-decoration: line-through; color: var(--color-muted-foreground); font-size: 1.1rem; font-family: var(--font-mono);">${window.auraStore.formatPrice(p.oldPrice)}</span>` : ''}
          </div>

          <p style="line-height: 1.85; color: var(--color-secondary); margin-bottom: var(--space-xl); font-size: 1.05rem;">
            ${desc}
          </p>

          <hr style="border: 0; border-top: 1px solid var(--color-border); margin-bottom: var(--space-xl);">

          <!-- Color options -->
          <h4 style="font-size: 0.95rem; font-weight: 700;">${t.colorTitle || 'Formal Shade:'}</h4>
          <div class="color-selector">
            ${p.colors.map((c, i) => {
              const cName = window.auraStore.getLocalized(c.name);
              return `
                <div class="color-pill ${i===0?'active':''}" onclick="selectColor('${cName}', this)">
                  <span class="color-dot" style="background: ${c.hex};"></span>
                  <span>${cName}</span>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Size options -->
          <h4 style="font-size: 0.95rem; font-weight: 700; margin-top: var(--space-lg);">${t.sizeTitle || 'Available Size:'}</h4>
          <div class="size-selector">
            ${p.sizes.map((s, i) => `
              <button class="size-btn ${i===0?'active':''}" onclick="selectSize('${s}', this)">${s}</button>
            `).join('')}
          </div>

          <!-- CTA Buttons -->
          <div style="display: flex; gap: var(--space-md); margin-top: var(--space-2xl); flex-wrap: wrap;">
            <button onclick="window.auraStore.addToCart('${p.id}', selectedSize, selectedColor)" class="btn btn-primary" style="flex-grow: 1; padding: 16px;">
              ${tFeatured.addToCart || 'Add to Bag'}
            </button>
            <a href="checkout.html" onclick="window.auraStore.addToCart('${p.id}', selectedSize, selectedColor)" class="btn btn-accent" style="padding: 16px 28px;">
              ${t.buyNow || 'Instant Order ⚡'}
            </a>
          </div>

          <div style="margin-top: var(--space-xl); padding: var(--space-md); border-radius: var(--radius-sm); background: var(--color-muted); display: flex; align-items: center; gap: var(--space-md);">
            <span style="font-size: 1.3rem;">📦</span>
            <p style="font-size: 0.85rem; color: var(--color-muted-foreground); margin: 0;">
              ${t.shippingNotice || 'Available across all 69 Wilayas.'}
            </p>
          </div>
        </div>
      `;
    }

    function changeGalleryImage(src, el) {
      document.getElementById('current-main-img').src = src;
      document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    function selectSize(size, el) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function selectColor(colorName, el) {
      selectedColor = colorName;
      document.querySelectorAll('.color-pill').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
